<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse the complete GearCashOut catalogue by manufacturer, category or product search.">
  <title>Shop | Retail Storefront</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">G</span>
      <span><strong>Retail Storefront</strong><small>GearCashOut Platform</small></span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html" aria-current="page">Shop</a>
      <button class="account-button" type="button">Account</button>
    </nav>
  </header>

  <main class="shop-layout">
    <aside class="filters">
      <div class="filter-heading">
        <h2>Browse</h2>
        <button type="button" id="clear-filters">Clear</button>
      </div>
      <label>
        Search catalogue
        <input id="search-input" type="search" placeholder="DJI, Sony, Nikon…">
      </label>
      <label>
        Manufacturer
        <select id="manufacturer-select">
          <option value="">All manufacturers</option>
        </select>
      </label>
      <label>
        Category
        <select id="category-select">
          <option value="">All categories</option>
        </select>
      </label>
      <p class="filter-note">Manufacturer visibility is centrally controlled. Hidden brands do not appear publicly.</p>
    </aside>

    <section class="catalogue-results">
      <div class="results-header">
        <div>
          <p class="eyebrow">CENTRAL CATALOGUE</p>
          <h1>Browse equipment</h1>
        </div>
        <p id="result-summary" aria-live="polite">Loading products…</p>
      </div>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
      <div class="load-more-wrap">
        <button class="primary-button" type="button" id="load-more">Load more products</button>
      </div>
    </section>
  </main>

  <footer>
    <span>Retail Storefront — development build</span>
    <span>Complete catalogue supplied from the central platform.</span>
  </footer>

  <script type="module" src="js/shop.js"></script>
</body>
</html>
