<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="View a published GearOutlet product listing.">
  <title>Product | GearOutlet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="product-page">
  <div class="announcement-bar">DEVELOPMENT PREVIEW <span>•</span> LIVE WEBSITE LISTING</div>
  <header class="site-header">
    <a class="brand brand-logo" href="index.html" aria-label="GearOutlet home"><img src="images/gearoutlet-brand.svg" alt="GearOutlet — Quality gear. Ready for more."></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop all</a>
      <button class="account-button" type="button">Account <span>↗</span></button>
    </nav>
  </header>

  <main>
    <div class="product-breadcrumb"><a href="shop.html">Shop all</a><span>›</span><span id="breadcrumb-product">Product</span></div>
    <section id="product-detail" class="product-detail" aria-live="polite">
      <div class="product-loading">Loading product…</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand brand-logo"><img src="images/gearoutlet-brand.svg" alt="GearOutlet"></div>
    <div class="footer-note">Published stock is supplied from the central GearCashOut sales system.</div>
  </footer>

  <script type="module" src="js/product.js"></script>
</body>
</html>
